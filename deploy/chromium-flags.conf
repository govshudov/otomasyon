# Raspberry Pi 4 kiosk için Chromium bayrakları.
# Her satır bir bayrak; kiosk.sh bunları okur.

--kiosk
--noerrdialogs
--disable-infobars
--no-first-run
--start-fullscreen
--disable-session-crashed-bubble
--disable-features=Translate,MediaRouter,AutofillServerCommunication
--check-for-update-interval=31536000

# GPU: V3D sürücüsünü zorla kullan.
#
# DİKKAT — `--use-gl=egl` KULLANMAYIN. Chromium 136'da bu değer GEÇERSİZ ve
# geçersiz değer görünce hiçbir uyarı vermeden SwiftShader'a (CPU yazılım
# rasterleştirme) düşüyor: 9 fps. Sahada ölçüldü.
# Doğru kombinasyon aşağıdaki iki satır.
--use-gl=angle
--use-angle=gl
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy

# Wayland (Bookworm varsayılanı labwc). X11'deyse bu iki satırı sil.
--enable-features=UseOzonePlatform
--ozone-platform=wayland

# Dolgu hızı bütçesi: cihaz ölçeği 1'e sabit. Retina benzeri ölçekleme
# Pi 4'te piksel sayısını 4'e katlar ve kare süresini aynı oranda büyütür.
--force-device-scale-factor=1

# Dokunmatik: tarayıcının kendi çift-dokunma yakınlaştırması kapalı olsun,
# sahnenin kendi pinch jesti çalışsın (canvas'ta touch-action: none var).
--touch-events=enabled
--overscroll-history-navigation=0

# Kiosk kalıcılığı
--autoplay-policy=no-user-gesture-required
--password-store=basic
--disable-pinch=false
