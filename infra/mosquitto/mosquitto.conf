# Geliştirme yapılandırması. Sahaya çıkarken: allow_anonymous false + parola dosyası + TLS.
listener 1883
allow_anonymous true

# Frontend doğrudan MQTT'ye bağlanmak isterse (şu an API üzerinden gidiyoruz)
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
