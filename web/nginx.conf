# Pi üzerinde arayüzü sunar ve API'yi aynı origin'e proxy'ler.
# Aynı origin olması şart: WebSocket ve fetch için CORS/karışık içerik sorunu kalmasın.
server {
    listen 80;

    # Docker'ın gömülü DNS'i. Değişken kullanılmadan proxy_pass yazılırsa nginx
    # yukarı akış IP'sini AÇILIŞTA bir kez çözer ve önbelleğe alır; api konteyneri
    # yeniden oluşturulunca IP değişir ve arayüz 502 verir. Sahada bunu kimse
    # fark etmez, "sistem çöktü" sanılır. Değişkenle her istekte yeniden çözülür.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Model dosyaları büyük ve DEĞİŞMEZ (üretici yeni sürümde adı değiştirir).
    # Uzun önbellek Pi'de her açılışta 525 KB indirmeyi önler.
    # DİKKAT: model dosyaları HASH'SİZ adlarla sunuluyor (ps-01.glb). "immutable"
    # dersek üretici yeni model yazsa bile tarayıcı 30 gün eskisini kullanır —
    # sahada tam bu oldu: arazi katmanı Pi'ye gitti ama ekranda çıkmadı.
    # ETag ile her istekte doğrulansın; değişmediyse 304, maliyeti yok.
    location /models/ { add_header Cache-Control "no-cache"; }
    location /draco/  { expires 30d; add_header Cache-Control "public, immutable"; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # index.html asla önbelleğe alınmaz — güncelleme anında görünsün
    location = /index.html { add_header Cache-Control "no-store"; }

    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /ws {
        set $ws_upstream api;
        proxy_pass http://$ws_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # WebSocket uzun yaşar, kesilmesin
        proxy_send_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
    # .glb zaten Draco ile sıkıştırılmış — tekrar gzip'lemek boşuna CPU
}
